<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Journey</title>
<style>
:root{color-scheme:light;--ink:#14231b;--muted:#5d6b63;--line:#e3e8e4;--bg:#f3f6f2;--card:#fff;--grass:#2f8f4e;--grass-dark:#1f6b38;--lime:#c6f432;--gold:#f5b700}
*{box-sizing:border-box}
body{margin:0;font-family:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.hero{position:relative;overflow:hidden;color:#fff;padding:44px 20px 70px;background:repeating-linear-gradient(90deg,#2f8f4e 0 70px,#2a8447 70px 140px)}
.hero svg.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.hero-inner{position:relative;max-width:920px;margin:0 auto;display:flex;align-items:center;gap:24px}
.ball-big{width:96px;height:96px;flex:none;animation:bounce 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.ball-big{animation:none}}
.eyebrow{display:inline-block;background:var(--lime);color:#173404;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{font-size:40px;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:16px;opacity:.9}
.wrap{max-width:920px;margin:-44px auto 0;padding:0 20px 48px;position:relative}
.kpi-label{display:inline-block;background:#14231b;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:10px;box-shadow:0 4px 10px rgba(20,35,27,.15)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 6px 18px rgba(20,35,27,.08);display:flex;gap:12px;align-items:center}
.tile .ico{width:42px;height:42px;border-radius:12px;background:#e7f5ea;display:flex;align-items:center;justify-content:center;flex:none}
.tile .ico svg{width:24px;height:24px}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-size:28px;font-weight:800;line-height:1.1}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 6px 18px rgba(20,35,27,.06)}
.card h2{font-size:18px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.card h2 svg{width:20px;height:20px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.head .filter{margin-left:auto}
.chartbox{position:relative}
.chartbox svg{display:block;overflow:visible}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 22px));background:#14231b;color:#fff;font-size:13px;line-height:1.4;padding:8px 12px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:5px;font-weight:600}
input,select{font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:500}
input:focus,select:focus{outline:none;border-color:var(--grass)}
button.primary{font:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;border:none;background:var(--grass);color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
button.primary:hover{background:var(--grass-dark)}
button.primary svg{width:18px;height:18px}
button.ghost{font:inherit;background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
button.ghost:hover{border-color:#e24b4a;color:#a32d2d}
.err{color:#A32D2D;font-size:13px;min-height:18px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right}
.balls{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.balls svg{width:16px;height:16px}
.goalnum{font-weight:800}
.pill{display:inline-block;background:#e7f5ea;color:#1f6b38;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.zero{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
@media (max-width:560px){h1{font-size:30px}.ball-big{width:70px;height:70px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ball" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="#fff" stroke="#14231b" stroke-width="4"/>
      <polygon points="50,33 66,45 60,64 40,64 34,45" fill="#14231b"/>
      <g stroke="#14231b" stroke-width="4" stroke-linecap="round">
        <line x1="50" y1="33" x2="50" y2="14"/>
        <line x1="66" y1="45" x2="84" y2="39"/>
        <line x1="60" y1="64" x2="71" y2="80"/>
        <line x1="40" y1="64" x2="29" y2="80"/>
        <line x1="34" y1="45" x2="16" y2="39"/>
      </g>
      <path d="M38 6 L50 14 L62 6 A47 47 0 0 0 38 6Z" fill="#14231b"/>
      <path d="M93 34 L84 39 L88 56 A47 47 0 0 0 93 34Z" fill="#14231b"/>
      <path d="M80 86 L71 80 L58 92 A47 47 0 0 0 80 86Z" fill="#14231b"/>
      <path d="M20 86 L29 80 L42 92 A47 47 0 0 1 20 86Z" fill="#14231b"/>
      <path d="M7 34 L16 39 L12 56 A47 47 0 0 1 7 34Z" fill="#14231b"/>
    </symbol>
    <symbol id="goal" viewBox="0 0 24 24"><g fill="none" stroke="#1f6b38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6h18v13"/><path d="M3 10h18M3 14h18M8 6v13M12 6v13M16 6v13" stroke-width="1" opacity=".6"/></g></symbol>
    <symbol id="cleats" viewBox="0 0 24 24"><g fill="none" stroke="#1f6b38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c0-3 1-7 4-8l3 4c2 1 6 1 9 2 1 .5 2 1.5 2 3v1H3z"/><path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3"/></g></symbol>
    <symbol id="trophy" viewBox="0 0 24 24"><g fill="none" stroke="#1f6b38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"/></g></symbol>
    <symbol id="ico-chart" viewBox="0 0 24 24"><g fill="none" stroke="#1f6b38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l5-5 4 3 5-6"/></g></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="hero">
  <svg class="pitch" viewBox="0 0 920 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-width="3">
      <rect x="20" y="20" width="880" height="220"/>
      <line x1="460" y1="20" x2="460" y2="240"/>
      <circle cx="460" cy="130" r="55"/>
      <circle cx="460" cy="130" r="4" fill="#fff"/>
      <rect x="20" y="70" width="90" height="120"/>
      <rect x="20" y="100" width="35" height="60"/>
      <rect x="810" y="70" width="90" height="120"/>
      <rect x="865" y="100" width="35" height="60"/>
      <path d="M110 105 A35 35 0 0 1 110 155"/>
      <path d="M810 105 A35 35 0 0 0 810 155"/>
    </g>
  </svg>
  <div class="hero-inner">
    <svg class="ball-big" aria-hidden="true"><use href="#ball"/></svg>
    <div>
      <span class="eyebrow">Alexa's player stats</span>
      <h1>Hero Journey</h1>    </div>
  </div>
</header>

<main class="wrap">
  <div class="kpi-label">KPI tracking</div>
  <div class="tiles">
    <div class="tile"><div class="ico"><svg><use href="#cleats"/></svg></div><div><div class="l">Games played</div><div class="v" id="tGames">0</div></div></div>
    <div class="tile"><div class="ico"><svg><use href="#goal"/></svg></div><div><div class="l">Total goals</div><div class="v" id="tGoals">0</div></div></div>
    <div class="tile"><div class="ico"><svg><use href="#ico-chart"/></svg></div><div><div class="l">Goals per game</div><div class="v" id="tAvg">0</div></div></div>
    <div class="tile"><div class="ico"><svg><use href="#trophy"/></svg></div><div><div class="l">Best game</div><div class="v" id="tBest">0</div></div></div>
  </div>

  <section class="card">
    <div class="head">
      <h2><svg><use href="#ico-chart"/></svg>Path to MVP</h2>
      <label class="filter">Sport<select id="sportFilter"></select></label>
    </div>
    <div class="chartbox" id="chart"></div>
  </section>

  <section class="card">
    <div class="head"><h2><svg><use href="#cleats"/></svg>Add a game</h2></div>
    <form id="addForm" class="row" novalidate>
      <label>Date<input type="date" id="fDate"></label>
      <label>Sport<input type="text" id="fSport" value="Soccer" list="sports" style="width:140px"></label>
      <datalist id="sports"></datalist>
      <label>Goals scored<input type="number" id="fGoals" min="0" step="1" style="width:110px"></label>
      <label>Opponent (optional)<input type="text" id="fOpp" style="width:170px"></label>
      <button type="submit" class="primary"><svg><use href="#plus"/></svg>Add game</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <section class="card">
    <div class="head"><h2><svg><use href="#goal"/></svg>Game log</h2></div>
    <table>
      <thead><tr><th>Date</th><th>Sport</th><th>Opponent</th><th class="n">Goals</th><th></th></tr></thead>
      <tbody id="log"></tbody>
    </table>
  </section>
  <footer>New games are saved in this browser.</footer>
</main>

<script>
const KEY='alexa-player-stats-v1';
const seed=[{id:1,date:'2026-11-02',sport:'Soccer',goals:0,opp:''},{id:2,date:'2026-11-16',sport:'Soccer',goals:1,opp:''}];
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return seed.slice();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(games));}catch(e){}}
let games=load(),chart,view=[];
const $=id=>document.getElementById(id);
const BALL='<svg><use href="#ball"/></svg>';
function parts(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd);}
const fmtDate=d=>parts(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const shortDate=d=>parts(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function drawChart(){
  const el=$('chart');
  if(!view.length){el.innerHTML='<p style="color:var(--muted);text-align:center;padding:120px 0;margin:0">No games yet. Add your first one below.</p>';return;}
  const W=800,H=320,pl=64,pr=30,pt=26,pb=44,n=view.length;
  const data=view.map(g=>g.goals),maxY=Math.max(2,...data)+1;
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1);
  const y=v=>pt+(H-pt-pb)*(1-v/maxY);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Line chart of goals scored per game over time"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8f4e" stop-opacity=".3"/><stop offset="1" stop-color="#2f8f4e" stop-opacity="0"/></linearGradient></defs>`;
  for(let v=0;v<=maxY;v++){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#c9d1cb':'#e3e8e4'}" stroke-width="1"/><text x="${pl-12}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="#5d6b63">${v}</text>`;}
  s+=`<text transform="translate(18 ${(pt+H-pb)/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="600" fill="#5d6b63">Goals scored in game</text>`;
  const pts=view.map((g,i)=>[x(i),y(g.goals)]);
  if(n>1){
    const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
    s+=`<path d="${line} L${pts[n-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z" fill="url(#area)"/>`;
    s+=`<path d="${line}" fill="none" stroke="#2f8f4e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  view.forEach((g,i)=>{const [px,py]=pts[i];
    s+=`<text x="${px}" y="${H-pb+26}" text-anchor="middle" font-size="13" font-weight="600" fill="#5d6b63">${shortDate(g.date)}</text>`;
    s+=`<g class="pt" data-i="${i}" style="cursor:pointer"><circle cx="${px}" cy="${py}" r="20" fill="transparent"/><use href="#ball" x="${px-14}" y="${py-14}" width="28" height="28"/></g>`;});
  s+='</svg><div id="tip" class="tip"></div>';
  el.innerHTML=s;
  el.querySelectorAll('.pt').forEach(p=>{
    p.addEventListener('mouseenter',()=>{const i=+p.dataset.i,g=view[i],t=$('tip');
      t.innerHTML=`<b>${fmtDate(g.date)}</b><br>${g.goals} ${g.goals===1?'goal':'goals'}${g.opp?' vs '+esc(g.opp):''}`;
      t.style.left=(pts[i][0]/W*100)+'%';t.style.top=(pts[i][1]/H*100)+'%';t.style.opacity=1;});
    p.addEventListener('mouseleave',()=>{$('tip').style.opacity=0;});
  });
}

function render(){
  const sports=[...new Set(games.map(g=>g.sport))].sort();
  const sel=$('sportFilter'),cur=sel.value||'All';
  sel.innerHTML=['All',...sports].map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join('');
  $('sports').innerHTML=sports.map(s=>`<option value="${esc(s)}">`).join('');
  const f=sel.value;
  view=games.filter(g=>f==='All'||g.sport===f).sort((a,b)=>a.date.localeCompare(b.date));
  const total=view.reduce((s,g)=>s+g.goals,0);
  $('tGames').textContent=view.length;
  $('tGoals').textContent=total;
  $('tAvg').textContent=view.length?(total/view.length).toFixed(1):'0';
  $('tBest').textContent=view.length?Math.max(...view.map(g=>g.goals)):'0';

  $('log').innerHTML=view.slice().reverse().map(g=>{
    const icons=g.goals>0?`<span class="balls">${BALL.repeat(Math.min(g.goals,5))}</span>`:'';
    return `<tr><td>${fmtDate(g.date)}</td><td><span class="pill">${esc(g.sport)}</span></td><td>${esc(g.opp||'—')}</td><td class="n">${icons}<span class="goalnum${g.goals?'':' zero'}">${g.goals}</span></td><td class="n"><button class="ghost" data-id="${g.id}">Remove</button></td></tr>`;
  }).join('')||'<tr><td colspan="5" style="color:var(--muted)">No games yet. Add your first one above.</td></tr>';

  drawChart();
}

$('addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const date=$('fDate').value,sport=$('fSport').value.trim(),gv=$('fGoals').value,opp=$('fOpp').value.trim();
  if(!date){$('err').textContent='Enter a date first.';return;}
  if(!sport){$('err').textContent='Enter a sport.';return;}
  const goals=Number(gv);
  if(gv===''||!Number.isInteger(goals)||goals<0){$('err').textContent='Enter goals as a whole number, 0 or more.';return;}
  games.push({id:Date.now(),date,sport,goals,opp});
  save();$('fGoals').value='';$('fOpp').value='';$('err').textContent='';render();
});
['fDate','fSport','fGoals'].forEach(id=>$(id).addEventListener('input',()=>$('err').textContent=''));
$('log').addEventListener('click',e=>{const id=e.target.dataset.id;if(!id)return;games=games.filter(g=>String(g.id)!==id);save();render();});
$('sportFilter').addEventListener('change',render);
render();
</script>
</body>
</html>
